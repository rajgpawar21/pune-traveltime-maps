# DEMO ONLY. A second snapshot that is a what-if scenario (arterials 40% / 30% faster),
# used to exercise the time slider and change layer. It is NOT observed history.
defaults:
  grid_km: 1.0
  half_life_min: 10.0
  score_threshold: 0.75
  min_cluster_cells: 3
  smacof_alpha: 1.0
  off_network_km: 1.5
cities:
  pune-whatif:
    name: "Pune · what-if demo"
    tier: 1
    bbox: [73.75, 18.42, 73.97, 18.62]
    scan_margin: [73.65, 18.32, 74.07, 18.72]
    snapshots:
      - {id: base, label: "Baseline", pbf: data/pune-latest.osm.pbf}
      - id: arterials
        label: "What-if: faster arterials"
        pbf: data/pune-latest.osm.pbf
        speed_scale: {primary: 1.4, secondary: 1.3, trunk: 1.4}
